name: Kairo CI & Build Matrix

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install C dependencies for SQLite
        run: sudo apt-get update && sudo apt-get install -y gcc build-essential

      - name: Run Tests
        run: go test -v ./...

  build:
    name: Cross-Platform Build Matrix
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        run: go build -o kairo main.go

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kairo-${{ runner.os }}
          path: kairo